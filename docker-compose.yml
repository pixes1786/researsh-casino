services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: rc_dev_pass
      POSTGRES_DB: research_casino
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    environment:
      DATABASE_URL: postgresql://rc:rc_dev_pass@postgres:5432/research_casino?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_dev_only_min_32_chars_xxxxxxxxxxxxxxxx
      NODE_ENV: development
      WEB_ORIGIN: http://localhost:3000
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build: { context: ., dockerfile: docker/Dockerfile.web }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
