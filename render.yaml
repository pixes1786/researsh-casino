services:
  - type: web
    name: research-casino-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: |
      npm install -g pnpm@9.0.0
      NODE_ENV=development pnpm install --frozen-lockfile=false
      NODE_ENV=development pnpm --filter @rc/api prisma:generate
      NODE_ENV=development pnpm --filter @rc/api build
    startCommand: |
      NODE_ENV=production pnpm --filter @rc/api exec prisma migrate deploy
      NODE_ENV=production pnpm --filter @rc/api start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.12.2"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
